<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Trip tracker · GWC Data.AI</title>
<style>
  /* Standalone driver page (no app bundle). Brand tokens mirrored from theme.css. */
  :root { --brand: #6f3dba; --ok: #11a37f; --warn: #f58a3a; --bad: #e0445f; --ink: #172554; --muted: #64748b; --bg: #f5f7fa; --card: #ffffff; --line: #e2e8f0; --on: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --brand: #a684ee; --ink: #f1f5ff; --muted: #94a3b8; --bg: #090e1a; --card: #171a27; --line: #2a3350; --on: #0a1020; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Montserrat, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin: 0 auto 14px; max-width: 480px; }
  h1 { font-size: 20px; margin: 0 0 4px; } .muted { color: var(--muted); font-size: 13px; }
  .big { width: 100%; height: 58px; border: 0; border-radius: 14px; font: inherit; font-size: 17px; font-weight: 700; color: var(--on); background: var(--brand); cursor: pointer; }
  .big.stop { background: var(--bad); } .big:disabled { opacity: .5; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--on); background: var(--muted); }
  .pill.on { background: var(--ok); } .pill.warn { background: var(--warn); } .pill.bad { background: var(--bad); }
  label.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin: 12px 0; }
  label.consent input { width: 20px; height: 20px; margin-top: 2px; }
  ul { padding-left: 18px; margin: 6px 0; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <h1>Trip tracker</h1>
  <div class="muted" id="veh">Loading vehicle…</div>
</div>
<div class="card" id="tripCard" hidden>
  <div class="row" style="border:0"><b>Active trip</b><span id="tripId" class="muted"></span></div>
  <ul id="ship"></ul>
</div>
<div class="card">
  <div class="row" style="border:0"><span>Status</span><span id="state" class="pill">Not sharing</span></div>
  <div class="row"><span>Last position sent</span><span id="last">–</span></div>
  <div class="row"><span>Accuracy</span><span id="acc">–</span></div>
  <div class="row"><span>Waiting to send (offline)</span><span id="queue">0</span></div>
  <label class="consent"><input type="checkbox" id="consent" />
    <span>I agree to share this phone's location with the receiving company <b>only while this trip is active</b>. Sharing stops when I press Stop, close this page, or the trip ends.</span></label>
  <button class="big" id="go" disabled>Start sharing location</button>
  <p class="muted" id="msg"></p>
</div>
<script>
(() => {
  // The device key comes in the URL fragment (#k=...), which browsers never send to servers or logs.
  const key = new URLSearchParams(location.hash.slice(1)).get("k");
  const $ = id => document.getElementById(id);
  const QKEY = "trip_tracker_queue";
  let watch = null, queue = [], sending = false, wake = null;
  try { queue = JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch (e) { queue = []; }
  const saveQ = () => { try { localStorage.setItem(QKEY, JSON.stringify(queue.slice(-2000))); } catch (e) { /* storage unavailable */ } $("queue").textContent = queue.length; };
  const msg = t => { $("msg").textContent = t; };
  const state = (t, cls) => { $("state").textContent = t; $("state").className = "pill " + (cls || ""); };
  if (!key) { $("veh").textContent = "This link has no device key. Ask your dispatcher for the tracker link."; return; }
  if (!window.isSecureContext) msg("Location needs a secure (https) page. Open the https link from your dispatcher.");

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Device-Key": key } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || r.status);
    return d;
  }
  async function loadTrip() {
    try {
      const d = await api("/api/gps/trip");
      $("veh").textContent = `${d.kind === "VESSEL" ? "Vessel" : "Truck"} ${d.registration} · ${d.vehicle_id}`;
      if (d.trip) {
        $("tripCard").hidden = false; $("tripId").textContent = "#" + d.trip.trip_id;
        $("ship").innerHTML = d.trip.shipments.map(s => `<li>${s.id} · ${s.material_name || ""} → ${s.plant_id === "IN-TN-01" ? "Chennai plant" : "Bengaluru plant"}</li>`).join("");
        $("go").disabled = !$("consent").checked;
      } else { $("tripCard").hidden = true; msg("No active trip for this vehicle - tracking is only possible during a trip."); $("go").disabled = true; }
    } catch (e) { $("veh").textContent = "Cannot load vehicle: " + e.message; }
  }
  async function flush() {
    if (sending || !queue.length || !navigator.onLine) return;
    sending = true;
    try {
      const batch = queue.slice(0, 200);
      const r = await api("/api/gps/pings", { method: "POST", body: JSON.stringify({ pings: batch }) });
      queue = queue.slice(batch.length); saveQ();
      $("last").textContent = new Date().toLocaleTimeString();
      if (r.rejected && !r.accepted) { state("Rejected", "bad"); msg((r.reasons || []).join("; ")); stop(); }
      else state("Sharing", "on");
    } catch (e) { state("Offline – queued", "warn"); }
    sending = false;
  }
  function start() {
    if (!navigator.geolocation) { msg("This phone/browser has no location service."); return; }
    watch = navigator.geolocation.watchPosition(p => {
      queue.push({ ts: new Date(p.timestamp).toISOString(), lat: p.coords.latitude, lon: p.coords.longitude,
        speed_kmh: p.coords.speed != null ? Math.round(p.coords.speed * 3.6) : null, heading: p.coords.heading, accuracy_m: Math.round(p.coords.accuracy) });
      saveQ(); $("acc").textContent = `± ${Math.round(p.coords.accuracy)} m`;
    }, err => { state("Location blocked", "bad"); msg(err.message + " – allow location for this page."); }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
    if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { wake = w; }).catch(() => {});
    $("go").textContent = "Stop sharing"; $("go").classList.add("stop"); state("Sharing", "on");
  }
  function stop() {
    if (watch != null) navigator.geolocation.clearWatch(watch);
    watch = null; if (wake) { wake.release().catch(() => {}); wake = null; }
    $("go").textContent = "Start sharing location"; $("go").classList.remove("stop"); if ($("state").textContent === "Sharing") state("Not sharing");
  }
  $("consent").onchange = e => { $("go").disabled = !e.target.checked || $("tripCard").hidden; if (!e.target.checked) stop(); };
  $("go").onclick = () => (watch == null ? start() : stop());
  setInterval(flush, 15000); window.addEventListener("online", flush);
  saveQ(); loadTrip(); setInterval(loadTrip, 120000);
})();
</script>
</body>
</html>
